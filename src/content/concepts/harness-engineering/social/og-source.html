<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>Harness Engineering · Open Graph</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 627px; margin: 0; overflow: hidden; }
    body { color: #181713; background: #f4efe5; font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
    .og {
      position: relative; display: grid; grid-template-columns: 52% 48%;
      width: 100%; height: 100%; overflow: hidden; border: 16px solid #181713;
    }
    .grid {
      position: absolute; inset: 0; opacity: .48;
      background-image:
        linear-gradient(rgba(24,23,19,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24,23,19,.05) 1px, transparent 1px);
      background-size: 46px 46px;
    }
    .copy, .visual { position: relative; z-index: 2; }
    .copy { display: flex; flex-direction: column; padding: 47px 18px 42px 52px; }
    .brand {
      display: flex; align-items: center; gap: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 15px; font-weight: 850; letter-spacing: .15em;
    }
    .mark { display: block; width: 42px; height: 42px; border-radius: 12px; object-fit: contain; }
    .eyebrow {
      margin-top: 58px; color: #ff6948;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase;
    }
    h1 { margin: 17px 0 0; font-size: 70px; font-weight: 760; line-height: .88; letter-spacing: -.067em; }
    .thesis {
      margin-top: auto; padding-left: 17px; border-left: 8px solid #7567f6;
      font-size: 21px; font-weight: 680; line-height: 1.18; letter-spacing: -.025em;
    }
    .visual { display: flex; align-items: center; justify-content: center; padding: 54px 42px 54px 5px; }
    .stage {
      position: relative; width: 100%; height: 100%; overflow: hidden;
      border: 1.5px solid rgba(24,23,19,.23); border-radius: 30px;
      background: rgba(255,253,248,.68); box-shadow: 0 28px 70px rgba(65,49,27,.1);
    }
    .stage-label {
      position: absolute; top: 24px; left: 26px; color: #6f695f;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px; letter-spacing: .13em;
    }
    .core {
      position: absolute; z-index: 7; top: 51%; left: 46%;
      display: grid; place-items: center; width: 116px; height: 116px;
      transform: translate(-50%, -50%); border-radius: 50%;
      color: #fffdf8; background: #181713;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 15px; font-weight: 900; letter-spacing: .13em;
    }
    .ring {
      position: absolute; z-index: 3; top: 51%; left: 46%;
      width: var(--size); height: var(--size); transform: translate(-50%, -50%);
      border: 1.5px solid rgba(117,103,246,var(--opacity)); border-radius: 50%;
    }
    .ring span {
      position: absolute; top: 50%; right: -12px; padding: 4px 6px;
      transform: translateY(-50%); border: 1px solid rgba(24,23,19,.2);
      border-radius: 5px; background: #fffdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 8px; font-weight: 850;
    }
    .r1 { --size: 150px; --opacity: .85; }
    .r2 { --size: 196px; --opacity: .72; }
    .r3 { --size: 242px; --opacity: .6; }
    .r4 { --size: 288px; --opacity: .48; }
    .r5 { --size: 334px; --opacity: .36; }
    .r6 { --size: 380px; --opacity: .27; }
    .r1 span { top: -4px; right: 35px; }
    .r2 span { top: 15%; right: -2px; }
    .r3 span { top: 35%; right: -13px; }
    .r4 span { top: 51%; right: -17px; }
    .r5 span { top: 68%; right: -8px; }
    .r6 span { top: 83%; right: 11px; }
    .work {
      position: absolute; z-index: 8; right: 22px; bottom: 24px;
      padding: 11px 13px; border: 1.5px solid #181713; border-radius: 10px;
      background: #d8ff68; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px; font-weight: 900; letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <main class="og">
    <div class="grid"></div>
    <section class="copy">
      <div class="brand">
        <img class="mark" src="../../../../../assets/aaron-logo-assets/aaron-guo-website-logo.png" alt="">
        AARON GUO
      </div>
      <div class="eyebrow">Working vocabulary / 008</div>
      <h1>Harness<br>Engineering</h1>
      <div class="thesis">The model supplies capability.<br>The harness makes it dependable.</div>
    </section>
    <section class="visual">
      <div class="stage">
        <div class="stage-label">MODEL × HARNESS × ENVIRONMENT</div>
        <div class="ring r6"><span>RECOVERY</span></div>
        <div class="ring r5"><span>AUTHORITY</span></div>
        <div class="ring r4"><span>VERIFY</span></div>
        <div class="ring r3"><span>STATE</span></div>
        <div class="ring r2"><span>TOOLS</span></div>
        <div class="ring r1"><span>CONTEXT</span></div>
        <div class="core">MODEL</div>
        <div class="work">VERIFIABLE WORK</div>
      </div>
    </section>
  </main>
</body>
</html>
