title: "Should You Read AI-Generated Code?"
description: |
  Mitchell Hashimoto reads the code produced by his AI agents. Robert C. Martin says he does not read the implementation at all. The disagreement sounds fundamental—but both positions still depend on human judgment.

  This video examines what the two arguments actually say, why the software community split around them, what current industry experiments reveal, and why critical systems and systems of record require a stricter boundary.

  My conclusion: review depth should follow authority. The more consequential a change is, the stronger the evidence—and the clearer the human ownership—must be.

  Read the article:
